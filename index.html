<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>madlen — index</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#000;color:#e6e6e6;
    font-family:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    font-size:15px;line-height:1.6;
    min-height:100vh;display:flex;flex-direction:column;
    padding:clamp(1.2rem,5vw,3.5rem);
    -webkit-font-smoothing:antialiased;cursor:default;
  }
  ::selection{background:#e6e6e6;color:#000}
  .head{color:#666;margin-bottom:1.6rem;white-space:pre-wrap}
  .head .p{color:#e6e6e6}
  .head .c{display:inline-block;width:8px;height:15px;background:#e6e6e6;vertical-align:-2px;margin-left:2px;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .list{list-style:none;flex:1}
  .row{
    display:flex;align-items:baseline;gap:0;
    padding:1px clamp(.4rem,2vw,1rem);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row .pre{color:#555;width:2.2ch;flex-shrink:0}
  .row .name{color:#e6e6e6;text-decoration:none}
  .row .meta{color:#555;margin-left:1.2ch}
  .row.sel{background:#e6e6e6;color:#000}
  .row.sel .pre,.row.sel .name,.row.sel .meta{color:#000}
  .row:hover:not(.sel){background:#161616}
  .section-hdr{padding:1.4rem clamp(.4rem,2vw,1rem) .3rem;color:#444;font-size:12px;letter-spacing:.1em;text-transform:uppercase;user-select:none}

  .foot{color:#555;margin-top:1.8rem;border-top:1px solid #222;padding-top:1rem;white-space:pre-wrap}
  .foot kbd{color:#e6e6e6;background:#1a1a1a;border:1px solid #333;border-radius:3px;padding:0 5px;font-family:inherit;font-size:13px}
  @media(max-width:560px){.row .meta{display:none}}
</style>
</head>
<body>
  <div class="head"><span class="p">deniz@madlen</span>:<span style="color:#7a9">~/trials</span>$ ls prototypes/<span class="c"></span></div>

  <ul class="list" id="list">
    <!-- rows injected -->
  </ul>

  <div class="foot"><kbd>↑</kbd> <kbd>↓</kbd> select   <kbd>⏎</kbd> open   <kbd>j</kbd>/<kbd>k</kbd> vim   <span id="count"></span></div>

<script>
const SECTIONS = [
  {
    label: "Prototypes",
    files: [
      {file:"courses-proto.html",           meta:"my courses · mobile module path + gamification"},
      {file:"smartBoardV2.html",            meta:"smart board v2 · device-free participation"},
      {file:"smartboard.html",              meta:"interactive smartboard"},
      {file:"classSelectorComponent3.html", meta:"class selector v3"},
      {file:"classSelectorComponent2.html", meta:"class selector v2"},
      {file:"classSelectorComponent.html",  meta:"class selector v1"},
    ]
  },
  {
    label: "PRDs",
    files: [
      {file:"coursesPRD.html", meta:"okul.madlen · my courses definition document v1.1"},
    ]
  }
];

// Flatten to a navigable list, tracking section headers separately
const FLAT = [];
SECTIONS.forEach(s => {
  FLAT.push({type:'section', label: s.label});
  s.files.forEach(f => FLAT.push({type:'file', ...f}));
});
const FILES = FLAT.filter(f => f.type === 'file');

let sel = 0;
const list = document.getElementById('list');
document.getElementById('count').textContent = FILES.length + " items";

function render(){
  let fileIdx = -1;
  list.innerHTML = FLAT.map(item => {
    if(item.type === 'section') return `<li class="section-hdr">${item.label}</li>`;
    fileIdx++;
    const i = fileIdx;
    return `<li class="row ${i===sel?'sel':''}" data-i="${i}">
      <span class="pre">${i===sel?'›':' '}</span><a class="name" href="${item.file}">${item.file}</a><span class="meta">${item.meta}</span>
    </li>`;
  }).join('');
}

function open(i){ window.location.href = FILES[i].file; }

function move(d){
  sel = (sel + d + FILES.length) % FILES.length;
  render();
}

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown' || e.key==='j'){ e.preventDefault(); move(1); }
  else if(e.key==='ArrowUp' || e.key==='k'){ e.preventDefault(); move(-1); }
  else if(e.key==='Enter'){ e.preventDefault(); open(sel); }
  else if(e.key==='Home' || e.key==='g'){ e.preventDefault(); sel=0; render(); }
  else if(e.key==='End' || e.key==='G'){ e.preventDefault(); sel=FILES.length-1; render(); }
});

list.addEventListener('click', e=>{
  const row = e.target.closest('.row'); if(!row) return;
  const i = +row.dataset.i;
  if(i===sel) open(i); else { sel=i; render(); }
});

render();
</script>
</body>
</html>
