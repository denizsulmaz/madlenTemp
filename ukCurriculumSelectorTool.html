<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podcast Generator — UK Curriculum selector</title>
<style>
:root{
  --orange:#F5883E; --orange-d:#C2621D; --orange-l:#FFF4EA; --orange-b:#F9B984;
  --bg:#F7F3ED; --surface:#FFFFFF; --s2:#FCF9F4; --s3:#F8F4EE;
  --text:#251E16; --muted:#9C8E7E; --muted2:#B4A896; --border:#EFE7DC; --border2:#E4DACB;
  --purple:#8B5CF6; --purple-d:#6D28D9; --purple-l:#F5F3FF; --purple-b:#DDD6FE;
  --pink:#EC4899;
  --green:#10B981; --green-d:#047857; --green-l:#ECFDF5; --green-b:#A7F3D0;
  --amber:#F59E0B; --amber-d:#B45309; --amber-l:#FFFBEB; --amber-b:#FDE68A;
  --rose:#F43F5E;  --rose-d:#BE123C;  --rose-l:#FFF1F2;  --rose-b:#FECDD3;
  --blue:#3B82F6;  --blue-d:#1D4ED8;  --blue-l:#EFF6FF;  --blue-b:#BFDBFE;
  --violet:#8B5CF6;--violet-d:#6D28D9;--violet-l:#F5F3FF;--violet-b:#DDD6FE;
  --teal:#14B8A6;  --teal-d:#0F766E;  --teal-l:#F0FDFA;  --teal-b:#99F6E4;
  --shadow:0 1px 2px rgba(37,30,22,.04),0 8px 28px -12px rgba(37,30,22,.10);
  --r:16px; --r2:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
select,input{font:inherit;color:inherit}
svg{display:block}

.frame{display:flex;min-height:100vh}
.rail{width:52px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;position:sticky;top:0;height:100vh}
.rail .ri{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.rail .ri.on{background:var(--orange-l);color:var(--orange)}
.rail .ri:hover{background:var(--s3)}
@media(max-width:760px){.rail{display:none}}

.main{flex:1;min-width:0;padding:18px clamp(12px,4vw,44px) 60px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:4px 2px 6px}
.crumbs a{color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.crumbs a:hover{color:var(--text)}
h1{font-family:Georgia,'Times New Roman',serif;font-size:27px;letter-spacing:-.4px;margin:2px 0 2px}
.tagline{font-size:13.5px;color:var(--muted);font-weight:500;margin-bottom:16px}

.card{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:clamp(18px,2.5vw,34px)}
.card-title{font-size:15px;font-weight:800;color:var(--rose);margin-bottom:16px}

/* input-mode tabs */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.mode{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 8px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);font-weight:700;font-size:14px;color:var(--muted);transition:border-color .15s,background .15s,color .15s}
.mode:hover{border-color:var(--purple-b)}
.mode.on{background:var(--purple-l);border-color:var(--purple);color:var(--purple-d)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:30px}
@media(max-width:820px){.split{grid-template-columns:1fr}}

.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.lbl:first-child{margin-top:0}
.lbl .cnt{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted2)}

/* key stage pills */
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{padding:13px 8px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);font-weight:700;font-size:14px;text-align:center;transition:border-color .15s,background .15s,color .15s}
.pill:hover{border-color:var(--orange-b)}
.pill.on{background:var(--orange-l);border-color:var(--orange);color:var(--orange-d)}
.pill small{display:block;font-size:9.5px;font-weight:600;color:var(--muted);margin-top:1px}
.pill.on small{color:var(--orange-d);opacity:.75}
.pills.yr{grid-template-columns:repeat(4,1fr)}

/* curriculum buttons */
.curr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbtn{padding:14px 8px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);font-weight:700;font-size:13.5px;text-align:center;color:var(--muted);transition:border-color .15s,background .15s,color .15s}
.cbtn:hover{border-color:var(--orange-b)}
.cbtn.on{background:var(--orange-l);border-color:var(--orange);color:var(--orange-d)}

/* exam board */
.boards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.board{padding:14px 8px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);font-weight:700;font-size:13.5px;text-align:center;transition:border-color .15s,background .15s,color .15s}
.progs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.board:hover{border-color:var(--orange-b)}
.board.on{background:var(--orange-l);border-color:var(--orange);color:var(--orange-d)}
.qualnote{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--s3);border-radius:100px;padding:5px 11px;margin-top:10px}
.qualnote b{color:var(--text)}

/* subject cards */
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:330px;overflow-y:auto;padding:2px}
.subj{display:flex;align-items:center;gap:9px;padding:12px 11px;border-radius:11px;border:1px solid var(--border2);background:var(--surface);font-weight:700;font-size:13px;line-height:1.2;text-align:left;transition:border-color .15s;position:relative}
.subj .nm{min-width:0}
.subj .code{display:block;font-size:10.5px;font-weight:700;color:var(--muted2);margin-top:1px}
.subj .ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.subj.t-green{background:var(--green-l)}   .subj.t-green .ic{color:var(--green-d)}
.subj.t-amber{background:var(--amber-l)}   .subj.t-amber .ic{color:var(--amber-d)}
.subj.t-rose{background:var(--rose-l)}     .subj.t-rose .ic{color:var(--rose-d)}
.subj.t-blue{background:var(--blue-l)}     .subj.t-blue .ic{color:var(--blue-d)}
.subj.t-violet{background:var(--violet-l)} .subj.t-violet .ic{color:var(--violet-d)}
.subj.t-teal{background:var(--teal-l)}     .subj.t-teal .ic{color:var(--teal-d)}
.subj.t-green.on{border-color:var(--green)}.subj.t-amber.on{border-color:var(--amber)}
.subj.t-rose.on{border-color:var(--rose)}  .subj.t-blue.on{border-color:var(--blue)}
.subj.t-violet.on{border-color:var(--violet)}.subj.t-teal.on{border-color:var(--teal)}
.subj.on::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}

/* ── right panel: outcomes ── */
.search{width:100%;padding:11px 14px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);font-size:13px;font-weight:500;color:var(--text);outline:none;margin-bottom:10px}
.search::placeholder{color:var(--muted2)}
.search:focus{border-color:var(--orange-b)}
.units{border:1px solid var(--border);border-radius:var(--r2);background:var(--surface);max-height:520px;overflow-y:auto}
.unit{border-bottom:1px solid var(--border)}
.unit:last-child{border-bottom:none}
.uhead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;font-weight:700;font-size:13px;transition:background .12s}
.uhead:hover{background:var(--s2)}
.uhead .ucnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted2)}
.uhead .chev{color:var(--muted2);transition:transform .18s}
.unit.open .chev{transform:rotate(180deg)}
.ubody{display:none;padding:0 14px 10px}
.unit.open .ubody{display:block}
.oc{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:9px 8px;border-radius:9px;transition:background .12s}
.oc:hover{background:var(--s2)}
.oc.on{background:var(--orange-l)}
.oc .box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;background:var(--surface);color:#fff;transition:background .12s,border-color .12s}
.oc.on .box{background:var(--orange);border-color:var(--orange)}
.oc .box svg{opacity:0}
.oc.on .box svg{opacity:1}
.oc .code{font-size:10px;font-weight:800;color:var(--orange-d);letter-spacing:.02em;white-space:nowrap;margin-top:3px}
.oc .octag{margin-left:auto;flex-shrink:0;font-size:10.5px;font-weight:800;padding:3px 11px;border-radius:100px;margin-top:2px}
.oc .octag.core{background:var(--blue-l);color:var(--blue-d)}
.oc .octag.supp{background:var(--amber-l);color:var(--amber-d)}
.oc .tx b{font-weight:600;font-size:12.5px;display:block}
.oc .tx ul{list-style:none;margin-top:3px}
.oc .tx li{font-size:11px;color:var(--muted);font-weight:500;padding-left:2px}
.empty-note{font-size:12.5px;color:var(--muted2);font-weight:600;padding:26px 16px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--orange-l);color:var(--orange-d);border:1px solid var(--orange-b);font-size:11.5px;font-weight:700;padding:4px 7px 4px 10px;border-radius:100px}
.chip button{display:flex;color:inherit;opacity:.65}
.chip button:hover{opacity:1}

/* ── audio settings ── */
.settings{display:flex;flex-wrap:wrap;gap:14px;margin-top:20px}
.set{min-width:130px}
.set .k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.set select{width:100%;padding:9px 10px;border:1px solid var(--border2);border-radius:9px;background:var(--surface);font-size:13px;font-weight:600;outline:none}
.set select:focus{border-color:var(--orange-b)}
.voices{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.voice{display:flex;align-items:center;gap:8px;border:1px solid var(--border2);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;background:var(--surface)}
.voice .dot{width:22px;height:22px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tag{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:100px}
.tag.a{background:var(--amber-l);color:var(--amber-d)}
.tag.b{background:var(--blue-l);color:var(--blue-d)}
.compq{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:420px;margin-top:14px;padding:11px;border:1px solid var(--border2);border-radius:10px;font-weight:700;font-size:13px;color:var(--muted);transition:border-color .15s,color .15s}
.compq:hover{border-color:var(--orange-b);color:var(--text)}
.compq.on{background:var(--orange-l);border-color:var(--orange);color:var(--orange-d)}
.gen{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:18px;background:linear-gradient(90deg,#A78BFA,#EC4899);color:#fff;font-weight:800;font-size:14.5px;padding:13px;border-radius:12px;box-shadow:0 10px 24px -10px rgba(167,102,220,.55);transition:transform .14s,opacity .14s}
.gen:hover{transform:translateY(-1px)}
.gen[disabled]{opacity:.45;cursor:not-allowed;transform:none}
</style>
</head>
<body>

<div class="frame">
  <nav class="rail" aria-label="App navigation">
    <button class="ri" title="Home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></button>
    <button class="ri" title="Assignments"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></button>
    <button class="ri on" title="Toolbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4.5 4.5 0 0 0-6 6L3 18l3 3 5.7-5.7a4.5 4.5 0 0 0 6-6L15 12l-3-3 2.7-2.7z"/></svg></button>
    <button class="ri" title="Chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/></svg></button>
    <button class="ri" title="Library"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"/><path d="M9 3v18"/></svg></button>
    <button class="ri" title="Analytics"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
  </nav>

  <main class="main">
    <div class="crumbs"><a href="#"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Toolbox</a></div>
    <h1>Podcast Generator</h1>
    <div class="tagline">Turn your lessons into a podcast! 🎧</div>

    <div class="card">
      <div class="card-title">Create New Podcast</div>

      <div class="modes">
        <button class="mode"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>Text Input</button>
        <button class="mode on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>Learning Outcome</button>
        <button class="mode"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6z"/><path d="M14 3v6h6"/></svg>File Upload</button>
      </div>

      <div class="split">
        <div class="colL">
          <div class="lbl">Year</div>
          <div class="pills yr" id="yrPills"></div>

          <div class="lbl">Curriculum</div>
          <div class="curr" id="currBtns">
            <button class="cbtn" data-curr="intl">International Curriculum</button>
            <button class="cbtn on" data-curr="uk">National Curriculum</button>
          </div>

          <div id="ukLeft">
            <div class="lbl">Key stage</div>
            <div class="pills" id="ksPills"></div>
            <div class="qualnote"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Qualification: <b id="qualName">A-Level</b></div>

            <div class="lbl">Exam board</div>
            <div class="boards" id="boards"></div>

            <div class="lbl">Select subject</div>
            <div class="subjects" id="subjects"></div>
          </div>

          <div id="intlLeft" style="display:none">
            <div class="lbl">Programme</div>
            <div class="progs" id="progs"></div>

            <div class="lbl">Select course</div>
            <div class="subjects" id="courses"></div>
          </div>

          <div class="settings">
            <div class="set"><div class="k">Length</div><select><option>Short</option><option selected>Medium</option><option>Long</option></select></div>
            <div class="set"><div class="k">Output Language</div><select><option selected>🇬🇧 EN</option><option>🇹🇷 TR</option></select></div>
            <div class="set"><div class="k">CEFR Level</div><select><option>A2</option><option selected>B1</option><option>B2</option><option>C1</option></select></div>
          </div>
          <div class="voices">
            <div class="voice"><span class="dot"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>Albert <span class="tag a">Mature</span><span class="tag b">Normal</span></div>
            <div class="voice"><span class="dot"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>Audrey <span class="tag a">Adult</span><span class="tag b">Normal</span></div>
          </div>
          <button class="compq" id="compQ"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.8-4.7-2-8-2v15c3.3 0 6 .2 8 2 2-1.8 4.7-2 8-2V4c-3.3 0-6 .2-8 2zM12 6v15"/></svg>Insert Comprehension Questions</button>
        </div>

        <div class="colR">
          <input class="search" id="ocSearch" type="text" placeholder="Search specification topic/outcome...">
          <div class="units" id="units"></div>
          <div class="chips" id="ocChips"></div>
        </div>
      </div>

      <button class="gen" id="genBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>Generate Audio Lesson</button>
    </div>
  </main>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);

const KS=[{id:"KS1",qual:"National Curriculum"},{id:"KS2",qual:"National Curriculum"},{id:"KS3",qual:"National Curriculum"},{id:"KS4",qual:"GCSE"},{id:"KS5",qual:"A-Level"}];
const BOARDS=["AQA","Edexcel"];

const ICONS={
  bank:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>',
  brief:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>',
  dna:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3c0 6 10 6 10 12M17 3c0 6-10 6-10 12M7 15c0 3 2 6 2 6M17 15c0 3-2 6-2 6M8.5 7h7M8.5 17h7"/></svg>',
  flask:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v6L4.8 18a2 2 0 0 0 1.8 3h10.8a2 2 0 0 0 1.8-3L14 9V3M8 3h8M7.5 15h9"/></svg>',

function renderUnits(){
  const uk=state.curr==="uk";
  const spec=uk?SPEC[state.subject]:INTL_SPEC[state.course];
  const prefix=uk?(SUBJECTS.find(x=>x.id===state.subject)||{name:"SPC"}).name.split(/[ :]/)[0].slice(0,3).toUpperCase():(COURSES.find(x=>x.id===state.course)||{name:"IGC"}).name.slice(0,3).toUpperCase();
  if(!spec){$("units").innerHTML=`<div class="empty-note">${uk?"Specification outcomes for this subject aren't wired into this trial yet — try Accounting, Biology, Geography or Physics.":"Learning outcomes for this course aren't wired into this trial yet — try Biology."}</div>`;$("ocChips").innerHTML="";$("genBtn").disabled=true;return;}
  const q=state.q.trim().toLowerCase();
  const key=(o,i,j)=>`${i}-${j}-${o.c}`;
  $("units").innerHTML=spec.map((u,i)=>{
    const rows=u.ocs.map((o,j)=>({o,j})).filter(({o})=>!q||o.t.toLowerCase().includes(q)||u.unit.toLowerCase().includes(q)||o.c.includes(q));
    if(q&&!rows.length)return"";
    const open=q?true:state.open.has(i);
    const sel=u.ocs.filter((o,j)=>state.ocs.has(key(o,i,j))).length;
    return `<div class="unit ${open?"open":""}">
      <button class="uhead" data-unit="${i}">${i+1}. ${u.unit}<span class="ucnt">${sel}/${u.ocs.length}</span><span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></button>
      <div class="ubody">${rows.map(({o,j})=>`
        <button class="oc ${state.ocs.has(key(o,i,j))?"on":""}" data-oc="${key(o,i,j)}" aria-pressed="${state.ocs.has(key(o,i,j))}">
          <span class="box"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg></span>
          <span class="code">${prefix}.${o.c}</span>
          <span class="tx"><b>${o.t}</b><ul>${o.d.map(x=>`<li>– ${x}</li>`).join("")}</ul></span>
          ${o.tag?`<span class="octag ${o.tag}">${o.tag==="core"?"Core":"Supplement"}</span>`:""}
        </button>`).join("")}</div>
    </div>`;
  }).join("");
  const all=[];spec.forEach((u,i)=>u.ocs.forEach((o,j)=>all.push({k:key(o,i,j),o})));
  $("ocChips").innerHTML=[...state.ocs].map(k=>{const f=all.find(x=>x.k===k);return f?`<span class="chip">${f.o.t.length>44?f.o.t.slice(0,44)+"…":f.o.t}<button data-unchip="${k}" aria-label="Remove"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>`:""}).join("");
  $("genBtn").disabled=state.ocs.size===0;
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-curr],[data-ks],[data-board],[data-subj],[data-year],[data-prog],[data-course],[data-unit],[data-oc],[data-unchip],#compQ");
  if(!t)return;
  if(t.dataset.curr){if(state.curr!==t.dataset.curr){state.curr=t.dataset.curr;renderCurr();renderUnits();}}
  else if(t.dataset.ks){state.ks=t.dataset.ks;renderKs();}
  else if(t.dataset.board){state.board=t.dataset.board;renderBoards();}
  else if(t.dataset.subj){if(state.subject!==t.dataset.subj){state.subject=t.dataset.subj;state.ocs.clear();state.open=new Set([0]);}renderSubjects();renderUnits();}
  else if(t.dataset.year){state.year=t.dataset.year;renderYears();}
  else if(t.dataset.prog){state.prog=t.dataset.prog;renderProgs();}
  else if(t.dataset.course){if(state.course!==t.dataset.course){state.course=t.dataset.course;state.ocs.clear();state.open=new Set([0]);}renderCourses();renderUnits();}
  else if(t.dataset.unit!==undefined){const i=+t.dataset.unit;state.open.has(i)?state.open.delete(i):state.open.add(i);renderUnits();}
  else if(t.dataset.oc){state.ocs.has(t.dataset.oc)?state.ocs.delete(t.dataset.oc):state.ocs.add(t.dataset.oc);renderUnits();}
  else if(t.dataset.unchip){state.ocs.delete(t.dataset.unchip);renderUnits();}
  else if(t.id==="compQ"){t.classList.toggle("on");}
});
$("ocSearch").addEventListener("input",e=>{state.q=e.target.value;renderUnits();});

renderAll();
})();
</script>
</body>
</html>
