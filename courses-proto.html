<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okul Madlen — My Courses Prototype</title>
<style>
:root{
  --lilac:#9B87F5; --lilac-d:#6D5BD4; --lilac-l:#EDE9FF; --lilac-m:#C4B8FB;
  --bg:#F0EDFF; --surface:#fff; --s2:#FAF9FF;
  --text:#1B1830; --muted:#8A83A6; --border:#ECE9F6;
  --green:#34D399; --green-l:#ECFDF5; --green-d:#059669;
  --amber:#F59E0B; --amber-l:#FFF8EC; --amber-d:#B45309;
  --coral:#FB7185; --coral-l:#FFF1F2;
  --grad:linear-gradient(135deg,#A593F8,#7C66E6);
  --r:24px; --r2:18px;
  --pw:390px; --ph:844px; --pr:46px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:34px 24px;gap:34px;transition:background .4s ease;-webkit-font-smoothing:antialiased}

.phone-wrap{position:sticky;top:34px;flex-shrink:0}
.phone{width:var(--pw);height:var(--ph);background:#15121F;border-radius:var(--pr);padding:11px;box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 50px 90px -20px rgba(80,60,170,.45),0 4px 14px rgba(0,0,0,.35);position:relative}
.phone-screen{width:100%;height:100%;border-radius:calc(var(--pr) - 9px);background:var(--s2);overflow:hidden;position:relative;transition:background .4s ease}
.di{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:118px;height:33px;background:#15121F;border-radius:20px;z-index:100}

.sb{height:54px;padding:17px 26px 0;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:99;flex-shrink:0}
.sb-time{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.sb-icons{display:flex;gap:6px;align-items:center;color:var(--text)}

.screens{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .42s cubic-bezier(.32,.72,0,1);will-change:transform;background:var(--s2)}
.screen.active{transform:translateX(0)}
.screen.behind{transform:translateX(-26%)}

/* ── Catalog header ── */
.cat-header{padding:2px 22px 16px;flex-shrink:0}
.cat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.cat-greeting{font-size:13px;color:var(--muted);font-weight:500}
.cat-name{font-size:25px;font-weight:800;color:var(--text);letter-spacing:-.6px;margin-top:1px}
.cat-right{display:flex;align-items:center;gap:11px}
.xp-pill{display:inline-flex;align-items:center;gap:6px;background:var(--lilac-l);color:var(--lilac-d);font-size:13px;font-weight:800;padding:7px 12px 7px 10px;border-radius:100px;font-variant-numeric:tabular-nums}
.xp-pill svg{flex-shrink:0}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;box-shadow:0 4px 14px rgba(80,60,170,.22);position:relative;letter-spacing:.02em}

.cat-scroll{flex:1;overflow-y:auto;padding:2px 18px 36px;-webkit-overflow-scrolling:touch}
.cat-scroll::-webkit-scrollbar{display:none}
.sec-lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 4px 12px}
.sec-lbl:first-child{margin-top:4px}

/* Continue hero */
.hero-continue{background:var(--grad);border-radius:var(--r);padding:20px;color:#fff;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 16px 34px -12px rgba(90,65,190,.6);-webkit-tap-highlight-color:transparent;transition:transform .16s ease;display:flex;align-items:center;gap:16px}
.hero-continue:active{transform:scale(.98)}
.hero-continue .blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.hc-left{flex:1;min-width:0;position:relative;z-index:1}
.hc-eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.82}
.hc-title{font-size:23px;font-weight:800;letter-spacing:-.5px;margin:7px 0 6px;line-height:1.1}
.hc-sub{font-size:12.5px;font-weight:600;opacity:.85}
.hc-resume{display:inline-flex;align-items:center;gap:6px;margin-top:16px;background:rgba(255,255,255,.95);color:var(--lilac-d);font-size:13px;font-weight:800;padding:9px 15px;border-radius:100px;box-shadow:0 6px 16px rgba(0,0,0,.16)}
.hc-ring{position:relative;z-index:1;flex-shrink:0;display:flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25)}

/* Course card with ring */
.cc{background:var(--surface);border-radius:var(--r2);padding:14px;margin-bottom:11px;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .15s ease;box-shadow:0 2px 10px rgba(80,60,170,.04)}
.cc:active{transform:scale(.98)}
.cc-medal{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cc-info{flex:1;min-width:0}
.cc-cat{font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.cc-title{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.3px;line-height:1.2}
.cc-meta{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:5px}
.cc-ring{flex-shrink:0}
.cc-badge{position:absolute;top:10px;right:12px}
.cc-new{position:absolute;top:13px;right:14px;background:var(--coral);color:#fff;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:100px}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.stag{animation:slideUp .42s cubic-bezier(.22,.8,.3,1) forwards;opacity:0}

/* Certificates (compact, expandable; glass icon over gradient) */
.cert-mini{margin-top:4px;background:var(--grad);border-radius:var(--r2);padding:13px 15px;display:flex;align-items:center;gap:12px;color:#fff;cursor:pointer;box-shadow:0 10px 22px -13px rgba(90,65,190,.55);-webkit-tap-highlight-color:transparent;transition:transform .15s}
.cert-mini:active{transform:scale(.99)}
.cert-mini-ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.26);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cert-mini-txt{flex:1;min-width:0}
.cert-mini-t{font-size:14.5px;font-weight:800;letter-spacing:-.2px}
.cert-mini-s{font-size:11.5px;font-weight:600;opacity:.82;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cert-mini-chev{flex-shrink:0;opacity:.9;transition:transform .25s;display:flex}
.cert-mini.open .cert-mini-chev{transform:rotate(90deg)}
.cert-expand{max-height:0;overflow:hidden;transition:max-height .35s ease}
.cert-expand.open{max-height:260px;margin-top:11px}
.cert-row{display:flex;gap:11px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.cert-row::-webkit-scrollbar{display:none}
.cert-card-lite{flex-shrink:0;width:152px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px;box-shadow:0 2px 10px rgba(80,60,170,.05)}
.cclt-medal{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.cclt-tier{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.cclt-name{font-size:13.5px;font-weight:800;color:var(--text);margin:4px 0 7px;line-height:1.2}
.cclt-date{font-size:11px;color:var(--muted);font-weight:600}

/* Certificates page */
#s-certs,#s-cert-detail{background:var(--s2)}
.page-hdr{flex-shrink:0;padding:0 18px 8px}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--text);margin-top:4px}
.page-sub{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.certs-scroll{flex:1;overflow-y:auto;padding:8px 18px 32px}
.certs-scroll::-webkit-scrollbar{display:none}
.cert-list-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:11px;display:flex;align-items:center;gap:13px;cursor:pointer;box-shadow:0 2px 10px rgba(80,60,170,.04);transition:transform .15s;-webkit-tap-highlight-color:transparent}
.cert-list-card:active{transform:scale(.98)}
.clc-seal{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.clc-info{flex:1;min-width:0}
.clc-tier{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.clc-name{font-size:15px;font-weight:800;color:var(--text);margin-top:2px;letter-spacing:-.2px}
.clc-meta{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
.clc-chev{flex-shrink:0;opacity:.5;color:var(--muted)}

/* Certificate detail */
.cert-detail-scroll{flex:1;overflow-y:auto;padding:8px 18px 28px}
.cert-detail-scroll::-webkit-scrollbar{display:none}
.certificate{background:linear-gradient(160deg,#FFFEFA,#FAF7FF);border-radius:14px;padding:28px 22px 22px;position:relative;border:2px solid var(--tier);box-shadow:0 18px 42px -16px rgba(80,60,170,.4);text-align:center;overflow:hidden;margin-top:6px}
.certificate::before{content:'';position:absolute;inset:8px;border:1px solid var(--tier);opacity:.38;border-radius:8px;pointer-events:none}
.cert-wordmark{font-size:11px;font-weight:800;letter-spacing:.24em;color:var(--lilac-d);text-transform:uppercase;position:relative}
.cert-seal{width:58px;height:58px;border-radius:50%;background:var(--tier);display:flex;align-items:center;justify-content:center;margin:16px auto 14px;box-shadow:0 7px 18px rgba(0,0,0,.16);position:relative}
.cert-h{font-family:Georgia,'Times New Roman',serif;font-size:21px;font-weight:700;color:var(--text);letter-spacing:.01em;position:relative}
.cert-small{font-size:12px;color:var(--muted);margin:15px 0 4px;position:relative}
.cert-recipient{font-family:Georgia,serif;font-size:25px;font-weight:700;color:var(--lilac-d);margin:2px 0;border-bottom:1px solid var(--border);display:inline-block;padding:0 20px 7px;position:relative}
.cert-course{font-size:17px;font-weight:800;color:var(--text);margin-top:11px;position:relative;letter-spacing:-.2px}
.cert-tier-lbl{display:inline-block;margin-top:13px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:5px 15px;border-radius:100px;border:1.5px solid;position:relative}
.cert-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:24px;font-size:11px;color:var(--muted);font-weight:600;position:relative}
.cert-sign{font-family:Georgia,serif;font-style:italic;font-size:16px;color:var(--text);border-top:1px solid var(--border);padding-top:5px;font-weight:400}
.cert-stat{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 17px;margin-top:16px}
.cert-stat-l{font-size:13px;font-weight:700;color:var(--muted)}
.cert-stat-v{font-size:23px;font-weight:800;color:var(--green-d);font-variant-numeric:tabular-nums}
.cert-actions{display:flex;gap:11px;margin-top:14px}
.cert-act{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:14px;font-size:14.5px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent;border:none;transition:transform .12s}
.cert-act.share{background:var(--lilac-l);color:var(--lilac-d)}
.cert-act.dl{background:var(--lilac);color:#fff;box-shadow:0 4px 0 var(--lilac-d)}
.cert-act.share:active{transform:scale(.97)}
.cert-act.dl:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lilac-d)}
.toast{position:absolute;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:#15121F;color:#fff;font-size:13px;font-weight:700;padding:11px 18px;border-radius:100px;opacity:0;transition:all .3s cubic-bezier(.34,1.4,.64,1);z-index:300;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Course path ── */
#s-course{background:var(--s2)}
.cd-hero{flex-shrink:0;padding:0 18px 6px}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--lilac-d);cursor:pointer;padding:6px 2px;-webkit-tap-highlight-color:transparent}
.course-banner{border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;margin-top:2px}
.cb-top{display:flex;align-items:center;gap:13px}
.cb-emoji{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,.22)}
.cb-cat{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.78}
.cb-title{font-size:21px;font-weight:800;letter-spacing:-.4px;line-height:1.1;margin-top:1px}
.cb-stats{display:flex;gap:20px;margin-top:14px}
.cb-stat{display:flex;flex-direction:column}
.cb-sv{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.cb-sl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.72;margin-top:1px}

.cd-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cd-scroll::-webkit-scrollbar{display:none}
.path{position:relative;margin:0 auto}
.path-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s ease;z-index:2}
.node:active{transform:scale(.93)}
.node.done{background:var(--lilac);color:#fff;box-shadow:0 6px 0 var(--lilac-d)}
.node.active{background:var(--lilac);color:#fff;box-shadow:0 6px 0 var(--lilac-d),0 0 0 6px var(--lilac-l)}
.node.locked{background:#E4E1F0;color:#AAA3C2;box-shadow:0 6px 0 #CFCBE0;cursor:default}
.node.bonus{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#fff;box-shadow:0 6px 0 var(--amber-d)}
.pulse{animation:pulseRing 2s ease-out infinite}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 var(--lilac)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
.node-lbl{position:absolute;width:130px;text-align:center;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:700;color:var(--text);line-height:1.25;z-index:1}
.node-lbl .nl-step{color:var(--muted);font-weight:800}
.node-lbl .nl-type{display:block;color:var(--lilac-d);font-weight:800;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;opacity:.9}
.node-lbl.locked-lbl{color:var(--muted)}.node-lbl.locked-lbl .nl-type{color:var(--muted);opacity:.7}
.start-bubble{position:absolute;left:50%;transform:translateX(-50%);background:#fff;color:var(--lilac-d);font-size:11px;font-weight:900;letter-spacing:.08em;padding:6px 13px;border-radius:100px;box-shadow:0 4px 12px rgba(80,60,170,.22);border:2px solid var(--lilac);z-index:3;white-space:nowrap;animation:bob 1.4s ease-in-out infinite}
.start-bubble::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--lilac);border-bottom:0}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
.unit-card{margin:14px 18px 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:13px 16px;display:flex;align-items:center;gap:11px;box-shadow:0 2px 10px rgba(80,60,170,.04)}
.uc-icon{flex-shrink:0;color:var(--lilac-d)}
.uc-t{font-size:14px;font-weight:800;color:var(--text)}
.uc-s{font-size:12px;color:var(--muted);margin-top:1px}

/* CEFR level headers + placement node */
.lvl-head{position:absolute;left:0;right:0;height:54px;display:flex;align-items:center;gap:11px;padding:0 12px;background:var(--s2);z-index:3}
.lvl-badge{width:42px;height:42px;border-radius:12px;background:var(--lilac);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:-.5px}
.lvl-head.done .lvl-badge{background:var(--green)}
.lvl-head.locked .lvl-badge{background:#E4E1F0;color:#AAA3C2}
.lvl-info{flex:1}
.lvl-name{font-size:15px;font-weight:800;color:var(--text)}
.lvl-head.locked .lvl-name{color:var(--muted)}
.lvl-sub{font-size:11px;font-weight:700;color:var(--muted);margin-top:1px;text-transform:uppercase;letter-spacing:.04em}
.lvl-end{display:flex;flex-shrink:0}
.node.placement{background:linear-gradient(135deg,#A78BFA,#7C66E6);box-shadow:0 6px 0 #5840C9}
body[data-band="pathfinder"] .node.placement{box-shadow:0 4px 14px rgba(60,55,128,.32)}

/* Speaking + placement components */
.speak-target{font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--text);background:var(--lilac-l);border-radius:14px;padding:18px;text-align:center;margin-bottom:24px;line-height:1.4}
.speak-rec{display:flex;flex-direction:column;align-items:center;gap:14px}
.rec-btn{width:76px;height:76px;border-radius:50%;background:var(--lilac);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 22px rgba(80,60,170,.38);transition:transform .15s;-webkit-tap-highlight-color:transparent}
.rec-btn:active{transform:scale(.94)}
.rec-btn.live{background:var(--coral);animation:micPulse 1s ease-in-out infinite}
.rec-wave{height:30px;display:flex;align-items:center;gap:3px;width:62%}
.rec-hint{font-size:12.5px;font-weight:700;color:var(--muted)}
.placement-intro{display:flex;gap:12px;background:var(--lilac-l);border-radius:14px;padding:14px;margin-bottom:20px;align-items:flex-start}
.pi-icon{width:40px;height:40px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pi-t{font-size:14px;font-weight:800;color:var(--text)}
.pi-s{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.5;margin-top:3px}

/* ── Module screen ── */
#s-module{background:var(--surface)}
.mod-hdr{padding:0 20px 14px;flex-shrink:0}
.mod-back{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;color:var(--lilac-d);cursor:pointer;padding:6px 0 12px}
.mod-progbar{display:flex;gap:5px;margin-bottom:9px}
.mp-seg{height:6px;flex:1;border-radius:100px;background:var(--border)}
.mp-seg.done{background:var(--lilac)}
.mp-seg.active{background:var(--lilac-m)}
.mod-step-lbl{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.q-area{flex:1;overflow-y:auto;padding:0 20px}
.q-area::-webkit-scrollbar{display:none}
.q-instruct{font-size:12.5px;font-weight:700;color:var(--muted);margin:-6px 0 16px;line-height:1.4}
.q-text{font-size:21px;font-weight:800;color:var(--text);letter-spacing:-.45px;line-height:1.3;margin-bottom:22px;text-wrap:balance}

.passage{background:var(--lilac-l);border-left:4px solid var(--lilac);border-radius:12px;padding:13px 15px;margin-bottom:18px;font-size:14.5px;line-height:1.62;color:var(--text)}
.passage .pg-lbl{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lilac-d);margin-bottom:7px}
.passage b{background:rgba(155,135,245,.3);padding:0 4px;border-radius:4px;font-weight:800}

.audio-pl{background:var(--lilac-l);border-radius:16px;padding:12px 15px;display:flex;align-items:center;gap:13px;margin-bottom:18px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.apl-btn{width:42px;height:42px;border-radius:50%;background:var(--lilac);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s;box-shadow:0 4px 10px rgba(80,60,170,.3)}
.apl-btn:active{transform:scale(.9)}
.apl-wave{flex:1;height:30px;display:flex;align-items:center;gap:2.5px}
.wb{flex:1;background:var(--lilac-m);border-radius:2px;height:30%;animation:wv var(--dur,.8s) ease-in-out infinite alternate;animation-play-state:paused}
@keyframes wv{from{height:14%}to{height:var(--h,60%)}}
.apl-dur{font-size:12px;font-weight:800;color:var(--lilac-d);font-variant-numeric:tabular-nums}

/* option rows (mc / ms / tf) */
.opt{background:#fff;border:1.6px solid var(--border);border-radius:13px;padding:15px 16px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:border-color .15s,background .15s,box-shadow .15s,transform .12s;-webkit-tap-highlight-color:transparent}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--lilac);background:var(--lilac-l);box-shadow:0 2px 12px -4px rgba(108,91,212,.3)}
.opt.corr{border-color:var(--green);background:var(--green-l)}
.opt.wrong{border-color:var(--coral);background:var(--coral-l)}
.opt-ltr{width:30px;height:30px;border-radius:50%;background:transparent;border:1.6px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--muted);flex-shrink:0;transition:all .15s}
.opt.sel .opt-ltr{background:var(--lilac);border-color:var(--lilac);color:#fff}
.opt.corr .opt-ltr{background:var(--green);border-color:var(--green);color:#fff}.opt.wrong .opt-ltr{background:var(--coral);border-color:var(--coral);color:#fff}
.opt-txt{font-size:15px;font-weight:600;color:var(--text);line-height:1.45;flex:1}
.opt-box{width:24px;height:24px;border-radius:7px;border:1.8px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .15s}
.opt.sel .opt-box{background:var(--lilac);border-color:var(--lilac)}
.opt.corr .opt-box{background:var(--green);border-color:var(--green)}.opt.wrong .opt-box{background:var(--coral);border-color:var(--coral)}
.tf-row{display:flex;gap:11px}
.tf-btn{flex:1;flex-direction:column;text-align:center;justify-content:center;padding:26px 0;gap:0}
.tf-btn .opt-ltr{margin:0 auto 11px;width:40px;height:40px}

/* fill in blank */
.fb-sentence{font-size:18px;font-weight:700;color:var(--text);line-height:1.7;margin-bottom:20px}
.fb-slot{display:inline-flex;align-items:center;justify-content:center;min-width:96px;padding:2px 12px;border-bottom:3px solid var(--lilac);color:var(--lilac-d);font-weight:800;margin:0 2px}
.fb-slot.empty{color:var(--muted);border-color:var(--border)}
.fb-bank{display:flex;flex-wrap:wrap;gap:9px}
.chip{background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:10px 15px;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.chip:active{transform:scale(.95)}
.chip.used{opacity:.35;pointer-events:none}
.chip.sel{border-color:var(--lilac);background:var(--lilac-l);color:var(--lilac-d)}

/* sequence */
.seq-item{background:#fff;border:1.6px solid var(--border);border-radius:13px;padding:14px 14px 14px 15px;margin-bottom:10px;display:flex;align-items:center;gap:13px;transition:transform .18s ease,box-shadow .18s ease,border-color .15s;touch-action:none;-webkit-tap-highlight-color:transparent;will-change:transform}
.seq-item.dragging{transition:none;border-color:var(--lilac);box-shadow:0 12px 28px -8px rgba(108,91,212,.45);position:relative}
.seq-num{width:28px;height:28px;border-radius:9px;background:var(--lilac);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.seq-item.dragging .seq-num{background:var(--lilac-d)}
.seq-txt{flex:1;font-size:15px;font-weight:700;color:var(--text)}
.seq-grip{color:var(--muted);display:flex;padding:4px 2px;cursor:grab;flex-shrink:0}
.seq-item.dragging .seq-grip{cursor:grabbing;color:var(--lilac-d)}

/* match */
.match-grid{display:flex;gap:14px}
.match-col{flex:1;display:flex;flex-direction:column;gap:10px}
.mt{border:2px solid var(--border);border-radius:13px;padding:12px;font-size:13.5px;font-weight:700;color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;transition:all .15s;min-height:58px;display:flex;align-items:center}
.mt.sel{border-color:var(--lilac);background:var(--lilac-l)}
.mt-badge{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.mt-badge:empty{display:none}
.match-hint{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:12px}

/* image tap */
.tap-scene{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.tap-tile{aspect-ratio:1;border:2px solid var(--border);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;background:var(--s2);color:var(--lilac-d);-webkit-tap-highlight-color:transparent;transition:all .15s}
.tap-tile:active{transform:scale(.96)}
.tap-tile.corr{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.tap-tile.wrong{border-color:var(--coral);background:var(--coral-l);color:var(--coral)}
.tap-cap{font-size:12px;font-weight:700;color:var(--text)}

/* free text + AI */
.ta{width:100%;min-height:120px;border:2px solid var(--border);border-radius:16px;padding:14px;font-size:14.5px;font-family:inherit;font-weight:500;color:var(--text);resize:none;line-height:1.5;background:var(--s2)}
.ta:focus{outline:none;border-color:var(--lilac);background:#fff}
.ai-feedback{margin-top:16px;border-radius:16px;padding:14px 15px;background:var(--lilac-l);border:1px solid var(--lilac-m);display:flex;gap:11px;opacity:0;transform:translateY(12px);transition:all .35s cubic-bezier(.34,1.4,.64,1)}
.ai-feedback.show{opacity:1;transform:translateY(0)}
.ai-ic{width:34px;height:34px;border-radius:10px;background:var(--lilac);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-name{font-size:11px;font-weight:800;color:var(--lilac-d);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.ai-body{font-size:13.5px;color:var(--text);line-height:1.5;font-weight:500}
.ai-score{display:inline-block;margin-top:8px;background:var(--lilac);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:100px}

/* chat */
.chat-thread{display:flex;flex-direction:column;gap:11px;margin-bottom:16px}
.msg{max-width:82%;padding:11px 14px;font-size:14px;line-height:1.45;font-weight:500;border-radius:18px}
.msg.ai{align-self:flex-start;background:var(--lilac-l);color:var(--text);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:var(--lilac);color:#fff;border-bottom-right-radius:5px}
.msg-who{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--lilac-d);margin-bottom:5px}
.chat-input{display:flex;gap:8px;align-items:center;padding:6px;border:2px solid var(--border);border-radius:100px;background:var(--s2)}
.chat-input input{flex:1;border:none;background:none;font-size:14px;font-family:inherit;font-weight:500;color:var(--text);padding:0 2px;min-width:0}
.chat-input input:focus{outline:none}
.chat-send{width:40px;height:40px;border-radius:50%;background:var(--lilac);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .15s}
.chat-send:active{transform:scale(.9)}
.scenario{background:var(--lilac-l);border-radius:14px;padding:14px 15px;margin-bottom:16px}
.scenario-tag{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--lilac-d);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.scenario-txt{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.5}
.goals{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.goal{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted);background:var(--s2);border:1.4px solid var(--border);border-radius:100px;padding:6px 13px 6px 7px;transition:all .25s}
.goal .gck{width:18px;height:18px;border-radius:50%;border:1.6px solid var(--border);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;transition:all .25s}
.goal.done{color:var(--green-d);border-color:var(--green);background:var(--green-l)}
.goal.done .gck{background:var(--green);border-color:var(--green)}
.chat-mic{width:40px;height:40px;border-radius:50%;background:var(--lilac-l);color:var(--lilac-d);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .15s}
.chat-mic:active{transform:scale(.9)}
.chat-mic.live{background:var(--coral);color:#fff;animation:micPulse 1s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(251,113,133,.5)}50%{box-shadow:0 0 0 9px rgba(251,113,133,0)}}
.eval-card{border:1.6px solid var(--border);border-radius:14px;padding:16px;background:#fff;margin-bottom:6px}
.eval-head{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--lilac-d);margin-bottom:13px}
.eval-overall{display:flex;align-items:baseline;gap:8px;margin-bottom:15px}
.eval-overall b{font-size:30px;font-weight:800;color:var(--text);letter-spacing:-1px;line-height:1}
.eval-line{margin-bottom:12px}.eval-line:last-child{margin-bottom:0}
.eval-line-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px}
.eval-line-top span:last-child{color:var(--lilac-d);font-variant-numeric:tabular-nums}
.eval-bar{height:6px;background:var(--border);border-radius:100px;overflow:hidden}
.eval-bar i{display:block;height:100%;width:0;background:var(--lilac);border-radius:100px;transition:width .8s cubic-bezier(.34,1.1,.64,1)}
.eval-note{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:4px}

/* timed */
.timer-chip{display:inline-flex;align-items:center;gap:7px;background:var(--amber-l);color:var(--amber-d);font-size:13px;font-weight:800;padding:8px 14px;border-radius:100px;margin-bottom:16px;font-variant-numeric:tabular-nums}

.res-banner{margin:0 20px 8px;border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:800;opacity:0;transform:translateY(16px);transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.res-banner svg{flex-shrink:0}
.res-banner.show{opacity:1;transform:translateY(0)}
.res-banner.corr-b{background:var(--green-l);color:var(--green-d)}
.res-banner.wrong-b{background:var(--coral-l);color:#9f1239}
.res-sub{font-weight:500;font-size:12px;margin-top:2px}

.chk-btn{margin:8px 20px 22px;background:var(--lilac);color:#fff;border:none;border-radius:16px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;transition:all .15s;letter-spacing:-.2px;flex-shrink:0;-webkit-tap-highlight-color:transparent;width:calc(100% - 40px);box-shadow:0 5px 0 var(--lilac-d)}
.chk-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lilac-d)}
.chk-btn:disabled{background:var(--border);color:var(--muted);cursor:default;box-shadow:0 5px 0 #DAD6E8}
.chk-btn.c-corr{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.chk-btn.c-wrong{background:var(--coral);box-shadow:0 5px 0 #BE123C}

.xp-burst{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:var(--lilac);color:#fff;padding:12px 24px;border-radius:100px;font-size:19px;font-weight:900;pointer-events:none;z-index:200;transition:all .5s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;box-shadow:0 10px 24px rgba(80,60,170,.4);display:flex;align-items:center;gap:8px}
.xp-burst.show{transform:translate(-50%,-170%) scale(1)}
.xp-burst.gone{transform:translate(-50%,-220%) scale(.8);opacity:0}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:150;border-radius:calc(var(--pr) - 9px)}

/* Milestone / journey celebration */
#s-milestone{background:var(--s2)}
.mile{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 28px;overflow-y:auto}
.mile-seal{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:22px;position:relative;animation:sealPop .55s cubic-bezier(.34,1.56,.64,1)}
.mile-seal::after{content:'';position:absolute;inset:-11px;border-radius:50%;border:3px solid currentColor;opacity:.22}
@keyframes sealPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.mile-tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.13em;margin-bottom:9px}
.mile-title{font-size:26px;font-weight:800;letter-spacing:-.6px;color:var(--text);line-height:1.14;text-wrap:balance}
.mile-sub{font-size:14px;color:var(--muted);font-weight:600;margin-top:11px;line-height:1.5;max-width:290px}
.mile-stats{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.mile-stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px;min-width:82px;box-shadow:0 2px 10px rgba(80,60,170,.04)}
.mile-stat b{font-size:20px;font-weight:800;color:var(--text);display:block;letter-spacing:-.4px}
.mile-stat span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:4px;display:block}
.mile-mini{margin-top:24px;width:100%;border:2px solid var(--tier);border-radius:13px;padding:18px;background:linear-gradient(160deg,#FFFEFA,#FAF7FF);box-shadow:0 14px 32px -16px rgba(80,60,170,.4)}
.mile-mini .mm-word{font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--lilac-d)}
.mile-mini .mm-name{font-family:Georgia,serif;font-size:18px;font-weight:700;color:var(--text);margin-top:8px}
.mile-mini .mm-tier{display:inline-block;margin-top:9px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:4px 12px;border-radius:100px;border:1.5px solid var(--tier);color:var(--tier)}

/* grounded high-school */
body[data-band="pathfinder"]{--r:18px;--r2:14px}
body[data-band="pathfinder"] .cat-name{letter-spacing:-.5px;font-weight:700}
body[data-band="pathfinder"] .cc{box-shadow:none}
body[data-band="pathfinder"] .hero-continue{box-shadow:0 14px 30px -14px rgba(40,36,90,.7)}
body[data-band="pathfinder"] .node{box-shadow:none}
body[data-band="pathfinder"] .node.done,body[data-band="pathfinder"] .node.active{box-shadow:0 4px 14px rgba(60,55,128,.32)}
body[data-band="pathfinder"] .node.active{box-shadow:0 0 0 5px var(--lilac-l),0 4px 14px rgba(60,55,128,.32)}
body[data-band="pathfinder"] .node.locked{box-shadow:none;background:#E6E5EE;color:#9C97B0}
body[data-band="pathfinder"] .node.bonus{box-shadow:0 4px 14px rgba(180,83,9,.28)}
body[data-band="pathfinder"] .start-bubble{animation:none}
body[data-band="pathfinder"] .chk-btn{box-shadow:0 3px 0 var(--lilac-d);border-radius:12px}

/* dev panel */
.dev{width:256px;flex-shrink:0;padding-top:6px}
.dev-eyebrow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--lilac-d);margin-bottom:11px;padding:0 4px}
.dev-card{background:rgba(255,255,255,.78);border:1px solid rgba(155,135,245,.2);border-radius:16px;padding:16px;margin-bottom:14px;backdrop-filter:blur(8px)}
.dev-ttl{font-size:11px;font-weight:800;color:var(--lilac-d);margin-bottom:11px;text-transform:uppercase;letter-spacing:.07em}
.dev-grp{display:flex;flex-direction:column;gap:7px}
.dev-btn{padding:10px 14px;border-radius:11px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:center;gap:9px}
.dev-btn:hover{border-color:var(--lilac);color:var(--lilac-d)}
.dev-btn.on{border-color:var(--lilac);background:var(--lilac-l);color:var(--lilac-d)}
.dev-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dev-grid .dev-btn{padding:9px 10px;font-size:12px;justify-content:center;text-align:center}
.dev-note{font-size:11.5px;color:var(--muted);line-height:1.7}
.dev-note b{color:var(--text)}

@media(max-width:760px){body{flex-direction:column;align-items:center}.dev{width:100%;max-width:390px}.phone-wrap{position:static}}
</style>
</head>

          <div class="cert-detail-scroll" id="cert-detail"></div>

          <div class="sb"><span class="sb-time">9:41</span><div class="sb-icons"><svg width="25" height="12" fill="currentColor"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="currentColor" stroke-opacity=".35" fill="none"/><rect x="2" y="2" width="16" height="8" rx="2"/><path d="M23 4v4a2 2 0 000-4z" opacity=".4"/></svg></div></div>

  <div class="dev-eyebrow">Dev Controls</div>

// ── Navigation ──
function nav(to,forward=true){
  const cur=stack[stack.length-1]; if(to===cur)return;
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('active','behind');
    if(s.id===cur){ s.classList.add(forward?'behind':''); s.style.transform=forward?'':'translateX(100%)'; }
    else if(s.id===to){ s.style.transform=forward?'translateX(100%)':'translateX(-26%)'; s.offsetHeight; s.classList.add('active'); s.style.transform=''; }
  });
  forward?stack.push(to):stack.pop();
}
function goBack(){ if(stack.length>1) nav(stack[stack.length-2],false); }
function animRings(scope){ (scope||document).querySelectorAll('.ring-fg').forEach(el=>{ el.style.strokeDashoffset=el.dataset.off; }); }

    <div class="cert-mini-ic">${icon('award','#fff',20)}</div>
    <div class="cert-mini-txt"><div class="cert-mini-t">${certs.length} Certificate${certs.length>1?'s':''} Earned</div><div class="cert-mini-s">${names}</div></div>
    <span class="cert-mini-chev">${icon('arrow','#fff',16)}</span></div>`;
}

function pathD(arr){ if(arr.length<2) return arr.length?`M${arr[0].x} ${arr[0].y}`:''; let d=`M${arr[0].x} ${arr[0].y}`;

function renderEnglishPath(c){

      document.querySelectorAll('#fb-bank .chip').forEach(el=>el.onclick=()=>{ if(MQ.done)return; document.querySelectorAll('#fb-bank .chip').forEach(c=>c.classList.remove('sel')); el.classList.add('sel'); MQ.sel=+el.dataset.i; const s=document.getElementById('fb-slot'); s.textContent=q.bank[MQ.sel]; s.classList.remove('empty'); armCheck('Check',true); });
      validateFn=()=>{ const ok=MQ.sel===q.correct; const s=document.getElementById('fb-slot'); s.style.borderColor=ok?'var(--green)':'var(--coral)'; s.style.color=ok?'var(--green-d)':'var(--coral)'; if(!ok)s.textContent=q.bank[q.correct]; return {ok,sub:ok?'The word fits the context.':'"'+q.bank[q.correct]+'" fits the surrounding sentence.'}; }; } },

  seq:{ html:()=>{ const q=DEF.seq; MQ.order=q.items.map((_,i)=>i); return `<div class="q-text">${q.text}</div><div class="q-instruct">Drag the steps into the correct order.</div><div id="seq-list"></div>`; },
    init:()=>{ renderSeq(); armCheck('Check',true);
      validateFn=()=>{ const ok=MQ.order.every((v,i)=>v===DEF.seq.correct[i]); return {ok,sub:ok?'Correct order.':'Not in order yet — use the arrows to rearrange.'}; }; } },

  match:{ html:()=>{ const q=DEF.match; return `<div class="q-text">${q.text}</div><div class="match-hint">Tap a sentence, then tap its role.</div><div class="match-grid">
      <div class="match-col">`+q.left.map((s,i)=>`<div class="mt mt-l" data-i="${i}">${s}<span class="mt-badge"></span></div>`).join('')+`</div>
      <div class="match-col">`+q.right.map((s,i)=>`<div class="mt mt-r" data-i="${i}">${s}<span class="mt-badge"></span></div>`).join('')+`</div></div>`; },
    init:()=>{ const q=DEF.match; MQ.map={}; MQ.selL=null; armCheck('Check',false);
      document.querySelectorAll('.mt-l').forEach(el=>el.onclick=()=>{ if(MQ.done)return; document.querySelectorAll('.mt-l').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); MQ.selL=+el.dataset.i; });
      document.querySelectorAll('.mt-r').forEach(el=>el.onclick=()=>{ if(MQ.done||MQ.selL===null)return; MQ.map[MQ.selL]=+el.dataset.i; MQ.selL=null; document.querySelectorAll('.mt-l').forEach(x=>x.classList.remove('sel')); updateMatch(); if(Object.keys(MQ.map).length===q.left.length)armCheck('Check',true); });
      validateFn=()=>{ const ok=q.correct.every((ri,li)=>MQ.map[li]===ri); return {ok,sub:ok?'Every role matched.':'Some pairings are off — tap to redo them.'}; }; } },

  tap:{ html:()=>{ const q=DEF.tap; return `<div class="q-text">${q.text}</div><div class="tap-scene">`+
      q.tiles.map((tl,i)=>`<div class="tap-tile" data-i="${i}">${icon(tl.ic,'currentColor',30)}<span class="tap-cap">${tl.t}</span></div>`).join('')+`</div>`; },
    init:()=>{ const q=DEF.tap; armCheck('Check',false);
      document.querySelectorAll('.tap-tile').forEach(el=>el.onclick=()=>{ if(MQ.done)return; document.querySelectorAll('.tap-tile').forEach(o=>o.style.borderColor=''); el.style.borderColor='var(--lilac)'; MQ.sel=+el.dataset.i; armCheck('Check',true); });
      validateFn=()=>{ const ok=MQ.sel===q.correct; document.querySelectorAll('.tap-tile').forEach((o,i)=>{ o.style.borderColor=''; if(i===q.correct)o.classList.add('corr'); else if(i===MQ.sel)o.classList.add('wrong'); }); return {ok,sub:ok?'That product is AI-powered.':'The recommendation app is the AI example.'}; }; } },

  free:{ html:()=>{ const q=DEF.free; return `<div class="q-text">${q.text}</div><textarea class="ta" id="ta" placeholder="Type your answer…"></textarea><div id="ai-fb"></div>`; },
    init:()=>{ armCheck('Submit to Madlen AI',false); const ta=document.getElementById('ta');
      ta.oninput=()=>armCheck('Submit to Madlen AI',ta.value.trim().length>3);
      validateFn=()=>{ document.getElementById('ai-fb').innerHTML=`<div class="ai-feedback"><div class="ai-ic">${icon('sparkles','#fff',18)}</div><div><div class="ai-name">Madlen AI</div><div class="ai-body">Good — your summary captures the main idea. Try naming the cause as well to make it complete.<span class="ai-score">Score 8 / 10</span></div></div></div>`;
        setTimeout(()=>document.querySelector('.ai-feedback').classList.add('show'),30);
        return {skip:true,title:'AI reviewed your answer',sub:'Formative feedback — no single right answer.'}; }; } },

  mcj:{ html:()=>{ const q=DEF.mcj; MQ.q=q; return `<div class="q-text">${q.text}</div>`+optRowsMC(q)+`<div style="font-size:13px;font-weight:800;color:var(--text);margin:18px 0 9px">Justify your choice</div><textarea class="ta" id="ta" style="min-height:88px" placeholder="Why did you pick that answer?"></textarea>`; },
    init:()=>{ const q=DEF.mcj; armCheck('Submit',false); MQ.sel=null;
      const upd=()=>armCheck('Submit',MQ.sel!=null&&document.getElementById('ta').value.trim().length>3);
      document.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{ if(MQ.done)return; document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); el.classList.add('sel'); MQ.sel=+el.dataset.i; upd(); });
      document.getElementById('ta').oninput=upd;
      validateFn=()=>{ const ok=MQ.sel===q.correct; lockOpts(q.correct,MQ.sel); return {ok,title:ok?'Strong choice':'Re-examine the evidence',sub:'Madlen AI also scores your justification.'}; }; } },

  read:{ html:()=>timedHTML('Reading timer'), init:()=>timedInit() },
  game:{ html:()=>timedHTML('Speed round'), init:()=>timedInit() },

  listen:{ html:()=>{ const q=DEF.listen; const bh=[40,65,28,80,50,72,35,62,45,78,55,38,82,60,32]; const bars=bh.map((h,i)=>`<div class="wb" style="--h:${h}%;--dur:${.58+i*.07}s;animation-delay:${i*.04}s"></div>`).join('');
      return `<div class="q-text">${q.prompt}</div>
        <div class="audio-pl" onclick="togAudio(this)"><div class="apl-btn"><svg id="apl-icon" width="14" height="16" viewBox="0 0 14 16" fill="white"><path d="M1 1.5L13 8L1 14.5V1.5Z"/></svg></div><div class="apl-wave">${bars}</div><div class="apl-dur">0:12</div></div>
        <div class="q-instruct">Tap play to listen — you can replay as many times as you like.</div>
        <div class="q-text" style="font-size:17px">${q.text}</div>`+q.opts.map((o,i)=>`<div class="opt" data-i="${i}"><div class="opt-ltr">${o.l}</div><div class="opt-txt">${o.t}</div></div>`).join(''); },
    init:()=>{ const q=DEF.listen; armCheck('Check',false);
      document.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{ if(MQ.done)return; document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); el.classList.add('sel'); MQ.sel=+el.dataset.i; armCheck('Check',true); });
      validateFn=()=>{ const ok=MQ.sel===q.correct; lockOpts(q.correct,MQ.sel); return {ok,sub:ok?'Correct — good listening.':'Replay and listen for the key detail.'}; }; } },

  speak:{ html:()=>{ const q=DEF.speak; const bh=[35,60,30,75,45,68,38,72,42,66,50]; const bars=bh.map((h,i)=>`<div class="wb" style="--h:${h}%;--dur:${.5+i*.06}s;animation-delay:${i*.05}s"></div>`).join('');
      return `<div class="q-text">${q.prompt}</div><div class="speak-target">“${q.target}”</div>
        <div class="speak-rec"><button class="rec-btn" id="rec-btn">${icon('mic','#fff',30)}</button><div class="rec-wave">${bars}</div><div class="rec-hint" id="rec-hint">Tap to record</div></div><div id="speak-fb"></div>`; },
    init:()=>{ armCheck('Submit recording',false); MQ.rec=false;
      const btn=document.getElementById('rec-btn'),hint=document.getElementById('rec-hint'),waves=document.querySelectorAll('.speak-rec .wb');
      btn.onclick=()=>{ if(MQ.done)return; MQ.rec=!MQ.rec; btn.classList.toggle('live',MQ.rec); waves.forEach(w=>w.style.animationPlayState=MQ.rec?'running':'paused');
        hint.textContent=MQ.rec?'Listening… tap to stop':'Recording ready'; if(!MQ.rec) armCheck('Submit recording',true); };
      validateFn=()=>{ document.getElementById('speak-fb').innerHTML=`<div class="ai-feedback show"><div class="ai-ic">${icon('sparkles','#fff',18)}</div><div><div class="ai-name">Madlen AI · Pronunciation</div><div class="ai-body">Clear and natural. Watch the “th” sound in “the”.<span class="ai-score">88% match</span></div></div></div>`;
        return {skip:true,title:'Pronunciation scored',sub:'Madlen AI reviewed your speech — see feedback above.'}; }; } },

  placement:{ html:()=>{ const q=DEF.placement; return `<div class="placement-intro"><div class="pi-icon">${icon('award',THEME[currentBand].d,22)}</div><div><div class="pi-t">Level Assessment</div><div class="pi-s">${q.note}</div></div></div>
      <div class="q-text">${q.text}</div>`+q.opts.map((o,i)=>`<div class="opt" data-i="${i}"><div class="opt-ltr">${o.l}</div><div class="opt-txt">${o.t}</div></div>`).join(''); },
    init:()=>{ const q=DEF.placement; armCheck('Submit answer',false);
      document.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{ if(MQ.done)return; document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); el.classList.add('sel'); MQ.sel=+el.dataset.i; armCheck('Submit answer',true); });
      validateFn=()=>{ lockOpts(q.correct,MQ.sel); return {skip:true,title:`Placed at ${q.level} · ${q.levelName}`,sub:'Your path starts here — earlier levels are marked complete.'}; }; } },

  chat:{ html:()=>`<div class="scenario"><div class="scenario-tag">${icon('sparkles',THEME[currentBand].d,13)} ${CHAT.tag}</div><div class="scenario-txt">${CHAT.setup}</div></div>
    <div class="goals" id="goals"></div>
    <div class="chat-thread" id="chat"></div>
    <div class="chat-input" id="chatbar"><button class="chat-mic" id="chat-mic">${icon('mic','currentColor',18)}</button><input id="chat-in" placeholder="Type or speak your reply…"><button class="chat-send" id="chat-send">${icon('send','#fff',18)}</button></div>`,
    init:()=>{ MQ.turn=0; const c=document.getElementById('chat');
      pushMsg(c,'ai',CHAT.open); renderGoals();
      document.getElementById('chat-send').onclick=()=>chatSend();
      document.getElementById('chat-in').onkeydown=e=>{ if(e.key==='Enter')chatSend(); };
      document.getElementById('chat-mic').onclick=()=>{ const m=document.getElementById('chat-mic'); m.classList.add('live'); showToast('Listening… (voice input mocked)'); setTimeout(()=>m.classList.remove('live'),1400); };
      armCheck('Finish & Evaluate',false);
      validateFn=()=>{ endChatEval(); return {skip:true,title:'Conversation evaluated',sub:'Madlen AI scored your whole chat — see the breakdown above.'}; }; } }
};
function renderGoals(){ const g=document.getElementById('goals'); if(!g)return;
  g.innerHTML=CHAT.goals.map((t,i)=>`<div class="goal ${i<MQ.turn?'done':''}"><span class="gck">${i<MQ.turn?icon('check','#fff',12,3.2):''}</span>${t}</div>`).join(''); }
function chatSend(txt){ if(MQ.done)return; const c=document.getElementById('chat'); const inp=document.getElementById('chat-in');
  const v=txt||(inp?inp.value.trim():''); if(!v)return; if(inp)inp.value='';
  pushMsg(c,'me',v); const ai=CHAT.aiTurns[MQ.turn]; MQ.turn++; armCheck('Finish & Evaluate',true); renderGoals();
  setTimeout(()=>{ if(ai)pushMsg(c,'ai',ai); if(MQ.turn>=CHAT.aiTurns.length) endChatEval(); },340); }
function endChatEval(){ const c=document.getElementById('chat'); const qr=document.getElementById('qr'); if(qr)qr.innerHTML='';
  const bar=document.getElementById('chatbar'); if(bar)bar.style.display='none';
  if(document.getElementById('eval-card')){ armCheck('Finish & Evaluate',true); return; }
  const ev=CHAT.eval; const card=document.createElement('div'); card.className='eval-card'; card.id='eval-card';
  card.innerHTML=`<div class="eval-head">${icon('sparkles','#6D5BD4',14)} Madlen AI · Conversation Review</div>
    <div class="eval-overall"><b>${ev.overall}%</b><span style="font-size:12px;font-weight:700;color:var(--muted)">overall</span></div>`+
    ev.lines.map(l=>`<div class="eval-line"><div class="eval-line-top"><span>${l[0]}</span><span>${l[2]}%</span></div><div class="eval-bar"><i data-w="${l[2]}"></i></div><div class="eval-note">${l[1]}</div></div>`).join('');
  c.insertAdjacentElement('afterend',card);
  setTimeout(()=>card.querySelectorAll('.eval-bar i').forEach(el=>el.style.width=el.dataset.w+'%'),40);
  armCheck('Finish & Evaluate',true); }

function timedHTML(label){ const q=DEF.timed; return `<div class="timer-chip" id="timer">${icon('clock','#B45309',16)} <span id="tval">1:30</span> · ${label}</div>
  <div class="passage"><span class="pg-lbl">Passage</span>${q.passage}</div><div class="q-text">${q.text}</div>`+optRowsMC(q); }
function timedInit(){ const q=DEF.timed; MQ.q=q; armCheck('Check',false);
  document.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{ if(MQ.done)return; document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); el.classList.add('sel'); MQ.sel=+el.dataset.i; armCheck('Check',true); });
  let s=90; const tv=document.getElementById('tval');
  MQ.timer&&clearInterval(MQ.timer);
  MQ.timer=setInterval(()=>{ if(MQ.done){clearInterval(MQ.timer);return;} s--; if(s<0){clearInterval(MQ.timer);return;} tv.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); },1000);
  validateFn=()=>{ clearInterval(MQ.timer); const ok=MQ.sel===q.correct; lockOpts(q.correct,MQ.sel); return {ok,sub:ok?'Correct — and on time.':'Option B is supported by the passage.'}; }; }

function pushMsg(c,who,text){ const d=document.createElement('div'); d.className='msg '+who; d.innerHTML=(who==='ai'?`<div class="msg-who">${icon('sparkles','#6D5BD4',12)} Madlen AI</div>`:'')+text; c.appendChild(d); c.parentElement.scrollTop=c.parentElement.scrollHeight; }

function renderSeq(){ const q=DEF.seq; const list=document.getElementById('seq-list');
  list.innerHTML=MQ.order.map((idx,pos)=>`<div class="seq-item"><div class="seq-num">${pos+1}</div><div class="seq-txt">${q.items[idx]}</div><div class="seq-grip">${icon('grip','currentColor',20,2.6)}</div></div>`).join('');
  attachSeqDrag(list); }
function attachSeqDrag(list){
  const items=[].slice.call(list.children); if(!items.length) return;
  const H=items[0].offsetHeight+10; // item height + margin
  items.forEach((el,pos)=>{
    el.addEventListener('pointerdown',e=>{
      if(MQ.done) return; e.preventDefault();
      const start=el.getBoundingClientRect().top, startY=e.clientY; let cur=pos;
      el.classList.add('dragging'); try{ el.setPointerCapture(e.pointerId); }catch(_){}
      const move=ev=>{ const dy=ev.clientY-startY; el.style.transform=`translateY(${dy}px)`;
        let np=pos+Math.round(dy/H); np=Math.max(0,Math.min(items.length-1,np));
        if(np!==cur){ items.forEach((it,ip)=>{ if(it===el) return; let sh=0;
            if(np>pos && ip>pos && ip<=np) sh=-H; else if(np<pos && ip<pos && ip>=np) sh=H;
            it.style.transform=sh?`translateY(${sh}px)`:''; }); cur=np; } };
      const up=()=>{ el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up);
        const o=MQ.order, moved=o.splice(pos,1)[0]; o.splice(cur,0,moved); el.classList.remove('dragging'); renderSeq(); };
      el.addEventListener('pointermove',move); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
    });
  });
}
function updateMatch(){ const cols=['#9B87F5','#34D399','#60A5FA','#F59E0B','#FB7185'];
  document.querySelectorAll('.mt').forEach(el=>{ el.querySelector('.mt-badge').textContent=''; el.style.borderColor=''; });
  Object.keys(MQ.map).forEach(li=>{ const ri=MQ.map[li], c=cols[li%cols.length];
    const l=document.querySelector('.mt-l[data-i="'+li+'"]'), r=document.querySelector('.mt-r[data-i="'+ri+'"]');
    [l,r].forEach(el=>{ if(!el)return; el.style.borderColor=c; const b=el.querySelector('.mt-badge'); b.textContent=(+li+1); b.style.background=c; }); }); }

// ── Celebrations ──
function showXP(){ const b=document.getElementById('xp-burst'); b.innerHTML=iconFill('bolt','#fff',20)+' +100 XP'; b.classList.remove('show','gone'); b.offsetHeight; b.classList.add('show');
  setTimeout(()=>{ b.classList.add('gone'); setTimeout(()=>b.classList.remove('show','gone'),500); },1400); }
function fireConfetti(){ const cv=document.getElementById('confetti'),ctx=cv.getContext('2d'); cv.width=cv.offsetWidth; cv.height=cv.offsetHeight;
  const t=THEME[currentBand], cols=[t.accent,'#34D399','#60A5FA','#F59E0B','#FB7185','#fff'];
  const pts=Array.from({length:55},()=>({x:cv.width/2+(Math.random()-.5)*cv.width*.6,y:cv.height*.35,vx:(Math.random()-.5)*5,vy:-(Math.random()*6+3),r:Math.random()*5+2,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*Math.PI*2,sp:(Math.random()-.5)*.25,sq:Math.random()>.5}));
  let f=0,max=90;(function draw(){ ctx.clearRect(0,0,cv.width,cv.height); pts.forEach(p=>{ p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.a+=p.sp; ctx.globalAlpha=Math.max(0,1-f/max); ctx.fillStyle=p.c; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); if(p.sq)ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r); else{ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();} ctx.restore(); }); ctx.globalAlpha=1; f++; if(f<max)requestAnimationFrame(draw); else ctx.clearRect(0,0,cv.width,cv.height); })(); }

// ── Band switch + dev ──
function setBand(band){ currentBand=band; stack=['s-catalog']; curCourse=null; curModInfo=null;
  const t=THEME[band]; document.body.dataset.band=band; document.body.style.background=t.bg;
  const r=document.body.style; r.setProperty('--lilac',t.accent); r.setProperty('--lilac-d',t.d); r.setProperty('--lilac-l',t.l); r.setProperty('--lilac-m',t.m); r.setProperty('--grad',t.grad); r.setProperty('--bg',t.bg);
  document.querySelectorAll('.dev-btn[data-band]').forEach(b=>b.classList.toggle('on',b.dataset.band===band));
  document.querySelectorAll('.screen').forEach(s=>{ s.classList.remove('active','behind'); s.style.transform='translateX(100%)'; });
  const cat=document.getElementById('s-catalog'); cat.style.transform=''; cat.classList.add('active'); renderCatalog(band); }
function devCourse(){ const c=BANDS[currentBand].courses.find(x=>x.active)||BANDS[currentBand].courses[0]; openCourse(c.id); }
function resetProto(){ MQ={}; curCerts=[]; curCourse=null; curModInfo=null; setBand('explorer'); }

const TYPE_LIST=[['mc','Multiple Choice'],['ms','Multiple Select'],['tf','True / False'],['fb','Fill in Blank'],['seq','Sequence'],['match','Drag & Match'],['tap','Image Tap'],['listen','Listening'],['speak','Speaking'],['free','AI Free Text'],['mcj','MC + Justify'],['read','Timed Read'],['game','Timed Game'],['chat','Chat with AI'],['placement','Placement']];
function buildDevTypes(){ document.getElementById('dev-types').innerHTML=TYPE_LIST.map(([k,l])=>`<button class="dev-btn" onclick="devType('${k}','${l}')">${l}</button>`).join(''); }
function devType(key,label){ curModInfo={cid:'_demo',mid:key,type:label,title:label}; MQ.passage=null;
  const onMod=stack[stack.length-1]==='s-module';
  renderQuestion(label,label,'Component preview · '+label,null);
  if(!onMod){ document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('active','behind');s.style.transform='translateX(100%)';}); const cat=document.getElementById('s-catalog'); cat.style.transform=''; cat.classList.add('active'); stack=['s-catalog']; nav('s-module'); } }

const sty=document.createElement('style');
sty.textContent='@keyframes nodeShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px) rotate(-4deg)}75%{transform:translateX(5px) rotate(4deg)}}';
document.head.appendChild(sty);

buildDevTypes();
setBand('explorer');
</script>
